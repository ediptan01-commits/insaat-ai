plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('INSAT_AI_STORE_FILE')
def releaseStorePassword = System.getenv('INSAT_AI_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('INSAT_AI_KEY_ALIAS')
def releaseKeyPassword = System.getenv('INSAT_AI_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.insaatai.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.insaatai.app'
        minSdk 23
        targetSdk 36
        versionCode (findProperty('APP_VERSION_CODE') ?: '1').toInteger()
        versionName findProperty('APP_VERSION_NAME') ?: '0.6.33'
        resValue 'string', 'app_home_url', findProperty('APP_HOME_URL') ?: 'https://insaat-ai.onrender.com/'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
